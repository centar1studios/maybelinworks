<!DOCTYPE HTML>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <meta name="description" content="Sign in to manage the Maybelin Works portfolio website.">
    <title>Portfolio Manager | Maybelin Works</title>
    <link rel="icon" type="image/png" sizes="32x32" href="./assets/favicon-32.png?v=20260816-19">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lato:wght@300;400;700;900&family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;0,800;0,900;1,400;1,600;1,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./stylesheet.css?v=20260816-19">
</head>

<body class="admin-login-page">
    <main class="admin-login-main">
        <section class="admin-login-card" aria-labelledby="login-heading">
            <!-- HEADING -->
            <div class="admin-login-heading">
                <p class="admin-login-kicker">Maybelin Works</p>
                <h1 id="login-heading">Portfolio Manager</h1>
                <p>Sign in to update your portfolio website.</p>
            </div>

            <!-- LOGIN FORM -->
            <form class="admin-login-form" id="admin-login-form">
                <div class="admin-form-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" name="username" autocomplete="username" required>
                </div>

                <div class="admin-form-group">
                    <label for="password">Password</label>
                    <div class="admin-password-wrapper">
                        <input type="password" id="password" name="password" autocomplete="current-password" required>
                        <button class="admin-password-toggle" type="button" id="password-toggle" aria-label="Show password">Show</button>
                    </div>
                </div>

                <!-- MESSAGE -->
                <p class="admin-login-status" id="admin-login-status" role="status" aria-live="polite"></p>

                <!-- SIGN IN -->
                <button class="admin-login-submit" type="submit">Sign In</button>
            </form>

            <!-- FOOTER -->
            <div class="admin-login-footer">
                <a href="./index.html">← Return to Website</a>
            </div>

        </section>

    </main>

    <script src="./admin-login.js?v=20260816-3"></script>

</body>

</html>
